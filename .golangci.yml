version: "2"

linters:
  exclusions:
    rules:
      # golangci-lint 2.13 (pulled in with the Go 1.26 toolchain) ships a staticcheck that
      # reports the Temporal SDK's SearchAttributes deprecation; 2.6 did not. Migrating to
      # TypedSearchAttributes changes how attributes are registered and searched, so it is
      # tracked separately rather than folded into a toolchain bump.
      - linters: [staticcheck]
        text: "SA1019: .*SearchAttributes is deprecated"
